# 强制 Gradle 用户目录在 D 盘（避免 IDE 未继承 GRADLE_USER_HOME 时写回 C:）
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dgradle.user.home=D:\\tools\\Gradle
systemProp.gradle.user.home=D:\\tools\\Gradle
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows 上 Kotlin daemon 增量缓存易锁文件失败，改进程内编译
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=2
