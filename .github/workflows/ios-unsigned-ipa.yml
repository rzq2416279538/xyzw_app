# 在 GitHub 的免费 macOS 跑器上编「未签名 IPA」，下载后用自签工具安装。
# 用法：GitHub → Actions →「iOS Unsigned IPA」→ Run workflow
#
# 说明：新版 Flutter 在 `flutter build ios --no-codesign` 时仍可能做签名预检
#（要求 Development Team），因此改为 --config-only + xcodebuild 强制关闭签名。
name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-*'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i Xcode || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: |
          # 插件走 CocoaPods，避免 SPM + 自定义 Podfile 混用导致签名/依赖异常
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter precache --ios

      - name: Configure iOS (no Flutter signing preflight)
        run: flutter build ios --release --no-codesign --config-only

      - name: CocoaPods
        working-directory: ios
        run: |
          test -f Podfile
          pod install --repo-update

      - name: Xcode build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build

          APP="build/ios-dd/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP"
          mkdir -p build/ios/iphoneos
          rm -rf build/ios/iphoneos/Runner.app
          cp -R "$APP" build/ios/iphoneos/Runner.app

      - name: Pack unsigned IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (
            cd "$STAGE"
            zip -qry "$GITHUB_WORKSPACE/咸强之王-unsigned.ipa" Payload
          )
          ls -lh "咸强之王-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-unsigned-ipa
          path: 咸强之王-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
