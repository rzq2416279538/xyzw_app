name: xyzw_app
description: 鱼壳 / xyzw_helper — Flutter 一期游戏壳（对齐 naiwa-release）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_picker: ^10.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 正版/第三方壳资源仅本地用（.gitignore 不入库）
  # 引擎对照 xyzw_web_helper；internal/turnpass/favicon 对照「鸟哥之王 Pro」assets/www
