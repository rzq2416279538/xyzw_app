    - assets/renderer/index.html
    - assets/renderer/hsdk-mock.js
    - assets/renderer/patch.js
    - assets/renderer/cocos-bundle-patch.js
    - assets/renderer/naiwa-uifix.css
    - assets/renderer/README.md
    - assets/renderer/cocos2d-js-min.a5841.js
    - assets/renderer/main.2a00e.js
    - assets/renderer/game-defines.a175e.js
    - assets/renderer/style-mobile.1777a.css
    - assets/renderer/splash.85cfd.png
    - assets/renderer/favicon.8de18.ico
    - assets/renderer/src/settings.da7ef.js
    - assets/renderer/src/assets/launcher/common/libs/platform/hortor/HSDK.turnpass.min.js
    - assets/renderer/assets/internal/config.json
    - assets/renderer/assets/internal/index.js
    - assets/renderer/assets/internal/config.a0340.json
    - assets/renderer/assets/internal/index.a0340.js
    - assets/renderer/assets/internal/import/09/0967b326a.1f618.json
    - assets/renderer/assets/internal/native/02/0275e94c-56a7-410f-bd1a-fc7483f7d14a.cea68.png
